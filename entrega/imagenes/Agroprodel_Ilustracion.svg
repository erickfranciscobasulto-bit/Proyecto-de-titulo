 <text x="852" y="435" font-size="25" font-weight="bold" fill="#fff" letter-spacing="1">AGROPRODEL</text>
 <text x="1042" y="435" font-size="15" fill="#C9D6EE">Ltda.</text>
</g>
<!-- comms tower (tech) -->
<g transform="translate(1385,300)">
 <polygon points="20,0 0,320 40,320" fill="none" stroke="#5B6770" stroke-width="5"/>
