<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" font-family="Arial, Helvetica, sans-serif">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5DA9E9"/><stop offset=".6" stop-color="#BFE0F7"/><stop offset="1" stop-color="#EAF5FC"/></linearGradient>
 <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF4C2"/><stop offset=".45" stop-color="#FFD66B"/><stop offset="1" stop-color="#FFD66B" stop-opacity="0"/></radialGradient>
 <linearGradient id="silo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8E9BA6"/><stop offset=".35" stop-color="#E8EDF1"/><stop offset=".7" stop-color="#B9C4CC"/><stop offset="1" stop-color="#7D8A95"/></linearGradient>
 <linearGradient id="wheat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2CF6B"/><stop offset="1" stop-color="#D49A2A"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9DC1F2"/><stop offset="1" stop-color="#4E7CDD"/></linearGradient>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF8F2"/><stop offset="1" stop-color="#E7E1D5"/></linearGradient>
 <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A8C97A"/><stop offset="1" stop-color="#86B05A"/></linearGradient>
 <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1F3864" flood-opacity=".25"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<circle cx="1330" cy="150" r="170" fill="url(#sun)"/><circle cx="1330" cy="150" r="58" fill="#FFE28A"/>
