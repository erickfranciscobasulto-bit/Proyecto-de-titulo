zabbix_export:
  version: '7.0'
  host_groups:
    - uuid: 69f4351756c24e13891edfc401079276
      name: 'Switches Agroprodel'
  hosts:
    - host: DIST-TEMUCO
      name: 'DIST-TEMUCO (Temuco)'
      templates:
        - name: 'Cisco IOS by SNMP'
      groups:
        - name: 'Switches Agroprodel'
      interfaces:
        - type: SNMP
          ip: 192.168.40.242
          port: '161'
          details:
            version: SNMPV3
            securityname: '{$SNMPV3_USER}'
            securitylevel: AUTHPRIV
            authprotocol: SHA1
            authpassphrase: '{$SNMPV3_AUTH}'
            privprotocol: AES128
            privpassphrase: '{$SNMPV3_PRIV}'
          interface_ref: if1
      macros:
        - macro: '{$ICMP_RESPONSE_TIME_WARN}'
          value: '0.4'
          description: 'Linea base VPN AWS ~140-290 ms'
      description: 'Switch Temuco - Distribucion. Gestion VLAN 99 192.168.40.242. SNMPv3 por la VPN.'
